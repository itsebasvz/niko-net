<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko-net - Perfil</title>
    
    <!-- El cadenero de seguridad -->
    <script src="js/auth-check.js"></script> 
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <header>
        <h1><a href="inicio.html" style="color: white; text-decoration: none;">Niko-net</a></h1>
        <button onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <main>
        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">
                <!-- Se llenará con la inicial o imagen desde JS -->
            </div>
            
            <div class="profile-info-container">
                <div class="profile-info">
                    <h2 id="profile-name">Cargando...</h2>
                    <span class="handle" id="profile-handle">@...</span>
                </div>
                <button id="follow-btn" class="btn-seguir">Seguir</button>
            </div>
            
            <p class="bio" id="profile-bio"></p>
            
            <div class="profile-stats">
                <div><strong id="count-followers">0</strong> Seguidores</div>
                <div><strong id="count-following">0</strong> Seguidos</div>
            </div>
        </div>

        <h3>Publicaciones</h3>
        <div id="posts-container">
            <!-- Los posts se inyectarán aquí -->
            <p>Cargando publicaciones...</p>
        </div>
    </main>

    <!-- El archivo con la lógica de la página de perfil -->
    <script src="js/perfil.js"></script>
</body>
</html>
