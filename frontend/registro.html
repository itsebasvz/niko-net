<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrate en Niko-net</title>
        <link rel="stylesheet" href="css/base.css">
    </head>
    <body>
        <h2>Registrarse</h2>
        <form id="registroForm">
            <input type="text" id="username" placeholder="Elige tu username" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Crea una contraseña" required>
            <input type="text" id="display_name" placeholder="Escribe tu nombre" required>
            <input type="text" id="bio" placeholder="¡Cuentale al mundo de ti!">
            <button type="submit">Crear cuenta</button>
        </form>
        
        <script src="js/registro.js"></script>
    </body>
</html>
